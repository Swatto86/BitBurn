name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Stage portable exe
        shell: pwsh
        run: |
          $ver = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $exe = Get-Item 'src-tauri/target/release/BitBurn.exe' -ErrorAction Stop
          $dest = "BitBurn_${ver}_x64-portable.exe"
          Copy-Item $exe.FullName $dest -Force
          Write-Host "Staged $dest ($([math]::Round($exe.Length/1MB,1)) MB)"
          New-Item -ItemType Directory -Force portable | Out-Null
          Move-Item $dest "portable/$dest" -Force

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe', 'src-tauri/target/release/bundle/msi/*.msi', 'portable/*.exe' -File)
          if ($files.Count -lt 3) { throw 'Expected NSIS, MSI and standalone executable' }
          $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding utf8 SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            portable/*.exe
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          name: BitBurn ${{ github.ref_name }}
          body_path: CHANGELOG.md
