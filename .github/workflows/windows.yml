name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb xdotool
      - run: npm ci
      - run: cargo install tauri-driver --locked
      - run: cargo install cargo-audit --locked
      - name: Matching Windows WebDriver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msedgedriver-tool
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $PWD.Path >> $env:GITHUB_PATH
      - name: Full Linux gate
        if: runner.os == 'Linux'
        run: xvfb-run -a bash scripts/verify.sh
      - name: Windows Rust formatting
        if: runner.os == 'Windows'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Windows strict lint
        if: runner.os == 'Windows'
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Windows Rust tests
        if: runner.os == 'Windows'
        env:
          BITBURN_CONTEXT_ROOT: 'Software\Classes\BitBurnCI'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --workspace --all-targets
      - name: Windows debug application
        if: runner.os == 'Windows'
        run: npm run tauri -- build --debug --no-bundle
      - name: Windows real desktop acceptance
        if: runner.os == 'Windows'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: acceptance-${{ runner.os }}
          path: e2e-failure.*
          if-no-files-found: ignore
